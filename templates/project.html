{% extends "base.html" %}
{% from "_macros.html" import project_row %}
{% block title %}Projects | {{ profile.name }}{% endblock %}

{% block content %}
<section class="page-head wrap">
  <p class="kicker"><i class="dot"></i> Selected work</p>
  <h1 class="page-title">Projects</h1>
</section>

<section class="wrap rows-section">
  <div class="rows">
    {% for p in projects %}
      {{ project_row(p, loop.index) }}
    {% endfor %}
  </div>
</section>
{% endblock %}
