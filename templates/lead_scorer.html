<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growzyn Lead Scorer | Live Demo</title>
  <style>
    :root { --bg:#0a0a0a; --text:#f2f2f2; --muted:#9a9a9a; --accent:#c6ff00; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }
    a.back { color: var(--accent); text-decoration: none; font-size: 14px; }
    h1 { font-size: clamp(36px, 7vw, 72px); line-height: 1; margin: 24px 0 12px;
         text-transform: uppercase; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p.lead { color: var(--muted); max-width: 640px; line-height: 1.6; }
    .note { color: var(--muted); font-size: 13px; margin: 16px 0; }
    .frame { border: 1px solid #222; border-radius: 16px; overflow: hidden;
             margin-top: 24px; background: #111; }
    iframe { width: 100%; height: 820px; border: 0; display: block; }
    .btn { display:inline-block; margin-top:20px; padding:12px 22px;
           background:var(--accent); color:#000; border-radius:999px;
           font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">&larr; Back to portfolio</a>
    <h1>Lead <span>Scorer</span></h1>
    <p class="lead">
      A Gradient Boosting model that grades B2B leads from A to D and recommends
      whether to contact them. Enter a lead's details below, or click an example.
    </p>
    <p class="note">The demo may take up to a minute to wake up on first load.</p>

    <div class="frame">
      <iframe src="{{ demo_url }}" title="Growzyn Lead Scorer demo" loading="lazy"></iframe>
    </div>

    <a class="btn" href="{{ demo_url }}" target="_blank" rel="noopener">
      Open demo in a new tab &nearr;
    </a>
  </div>
</body>
</html>
